name: Video editor · detect me

# Runs when a video lands in video-editor/inbox/ (or reference photos change),
# writes video-editor/detections/<video>.json and starts a project for new videos.
on:
  push:
    paths:
      - "video-editor/inbox/**"
      - "video-editor/reference/**"
  workflow_dispatch:
    inputs:
      video:
        description: "Repo path of one video (blank = every video without detections)"
        required: false
        default: ""
      sample_fps:
        description: "Frames analysed per second"
        default: "4"
      threshold:
        description: "Face-match threshold (lower = more lenient)"
        default: "0.363"
      aspect:
        description: "Aspect of suggested crops / new projects"
        default: "9:16"
      body:
        description: "Also use body detection when your face is hidden"
        type: boolean
        default: false
      force_project:
        description: "Overwrite an existing project for the video"
        type: boolean
        default: false

run-name: "Detect ${{ inputs.video || 'new videos' }}"

permissions:
  contents: write

concurrency:
  group: ve-detect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false  # videos are pulled one at a time by the pipeline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video-editor/tools/requirements.txt

      - name: Install ffmpeg and Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r video-editor/tools/requirements.txt

      - uses: actions/cache@v4
        with:
          path: video-editor/.models
          key: ve-models-v1

      - name: Detect
        env:
          VIDEO: ${{ inputs.video }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--aspect "${{ inputs.aspect || '9:16' }}" --sample-fps "${{ inputs.sample_fps || '4' }}" --threshold "${{ inputs.threshold || '0.363' }}")
          [ "${{ inputs.body }}" = "true" ] && args+=(--body)
          [ "${{ inputs.force_project }}" = "true" ] && args+=(--force-project)
          if [ -n "$VIDEO" ]; then
            python video-editor/tools/pipeline.py "$VIDEO" "${args[@]}"
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python video-editor/tools/pipeline.py --since "$BEFORE" "${args[@]}"
          else
            python video-editor/tools/pipeline.py --missing "${args[@]}"
          fi

      - name: Commit results
        run: |
          git config user.name "video-editor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-editor/detections video-editor/projects
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "detect: update detections and projects [bot]"
          for i in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 3; done
          exit 1
