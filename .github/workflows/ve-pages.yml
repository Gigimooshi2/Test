name: Video editor · deploy app

# Publishes video-editor/app to GitHub Pages
# (Settings → Pages → Source: "GitHub Actions" must be selected once).
on:
  push:
    branches: [master]
    paths: ["video-editor/app/**", ".github/workflows/ve-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: video-editor/app
      - id: deployment
        uses: actions/deploy-pages@v4
